<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Admin</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #64748b;
            --line: #dbe3ed;
            --paper: #ffffff;
            --wash: #eef5f7;
            --accent: #0f766e;
            --danger: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 18px;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #e7f4f2, #f8f5ed);
        }

        main {
            width: min(100%, 980px);
            margin: auto;
            padding: clamp(22px, 5vw, 48px);
            background: var(--paper);
            border: 1px solid rgba(15, 118, 110, 0.16);
            box-shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 8px; font-size: clamp(30px, 5vw, 48px); }
        h2 { margin-bottom: 0; font-size: 22px; }
        .eyebrow { margin-bottom: 6px; color: var(--accent); font: 700 12px Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
        .subtitle { margin-bottom: 0; color: var(--muted); font: 15px Arial, sans-serif; }

        button {
            padding: 11px 16px;
            border: 0;
            border-radius: 4px;
            color: white;
            background: var(--accent);
            font: 700 14px Arial, sans-serif;
            cursor: pointer;
        }

        button:hover { filter: brightness(0.9); }
        .secondary { color: var(--ink); background: #e6edf0; }
        .danger { background: var(--danger); }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .stat {
            padding: 18px;
            background: var(--wash);
            border-left: 4px solid var(--accent);
        }

        .stat span { display: block; color: var(--muted); font: 12px Arial, sans-serif; text-transform: uppercase; }
        .stat strong { display: block; margin-top: 5px; font-size: 28px; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .table-wrap { overflow-x: auto; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; font: 15px Arial, sans-serif; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
        th { color: var(--muted); background: #f7fafb; font-size: 12px; text-transform: uppercase; }
        tr:last-child td { border-bottom: 0; }
        td:last-child, th:last-child { text-align: right; }
        .empty { padding: 34px; color: var(--muted); text-align: center; font: 15px Arial, sans-serif; }

        @media (max-width: 600px) {
            header, .toolbar { align-items: stretch; flex-direction: column; }
            .summary { grid-template-columns: 1fr; }
            th, td { padding: 12px 10px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Computer Quiz</p>
                <h1>Admin dashboard</h1>
                <p class="subtitle">Review participant results and manage the stored leaderboard.</p>
            </div>
            <button class="secondary" type="button" onclick="logout()">Log out</button>
        </header>

        <section class="summary" aria-label="Quiz summary">
            <div class="stat"><span>Results shown</span><strong id="resultCount">0</strong></div>
            <div class="stat"><span>Highest score</span><strong id="highestScore">0/31</strong></div>
            <div class="stat"><span>Average score</span><strong id="averageScore">0/31</strong></div>
        </section>

        <section>
            <div class="toolbar">
                <h2>Top 10 participant results</h2>
                <div class="toolbar-actions">
                    <button class="secondary" type="button" onclick="loadResults()">Refresh</button>
                    <button class="danger" type="button" onclick="clearResults()">Clear all results</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>#</th><th>Participant</th><th>Score</th><th>Action</th></tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
                <p id="emptyMessage" class="empty" hidden>No participant results have been submitted yet.</p>
            </div>
        </section>
    </main>

    <script>
        const totalQuestions = 31;
        const apiBaseUrl = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
        const resultsBody = document.getElementById("resultsBody");
        const emptyMessage = document.getElementById("emptyMessage");

        if (sessionStorage.getItem("adminAuthenticated") !== "true") {
            window.location.replace("user login.html");
        }

        async function getResults() {
            const response = await fetch(`${apiBaseUrl}/api/results`);
            const results = await response.json();
            return Array.isArray(results) ? results : [];
        }

        async function loadResults() {
            const results = (await getResults())
                .map((result) => ({ ...result, score: Number(result.score) || 0 }))
                .sort((first, second) => second.score - first.score)
                .slice(0, 10);
            resultsBody.replaceChildren();
            emptyMessage.hidden = results.length > 0;
            document.getElementById("resultCount").textContent = results.length;

            const highest = results.reduce((max, result) => Math.max(max, Number(result.score) || 0), 0);
            const total = results.reduce((sum, result) => sum + (Number(result.score) || 0), 0);
            document.getElementById("highestScore").textContent = `${highest}/${totalQuestions}`;
            document.getElementById("averageScore").textContent = results.length
                ? `${(total / results.length).toFixed(1)}/${totalQuestions}`
                : `0/${totalQuestions}`;

            results.forEach((result, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `<td>${index + 1}</td><td></td><td>${Number(result.score) || 0}/${totalQuestions}</td><td></td>`;
                row.children[1].textContent = result.name || "Unnamed participant";
                const removeButton = document.createElement("button");
                removeButton.className = "danger";
                removeButton.type = "button";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", () => removeResult(index));
                row.children[3].append(removeButton);
                resultsBody.append(row);
            });
        }

        async function removeResult(index) {
            const results = await getResults();
            results.splice(index, 1);
            await fetch(`${apiBaseUrl}/api/results`, { method: "DELETE" });
            await Promise.all(results.map((result) => fetch(`${apiBaseUrl}/api/results`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(result)
            })));
            loadResults();
        }

        async function clearResults() {
            if (!(await getResults()).length || !window.confirm("Clear all stored quiz results?")) {
                return;
            }
            await fetch(`${apiBaseUrl}/api/results`, { method: "DELETE" });
            loadResults();
        }

        function logout() {
            sessionStorage.removeItem("adminAuthenticated");
            window.location.replace("user login.html");
        }

        loadResults();
    </script>
</body>
</html>
